<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram Login Mockup</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#262626;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.wrap{width:100%;max-width:350px}.card,.signup{background:#fff;border:1px solid #dbdbdb;text-align:center}.card{padding:38px 40px 28px}.igicon{width:62px;height:62px;border-radius:17px;margin:0 auto 18px;position:relative;background:linear-gradient(135deg,#405de6,#833ab4,#e1306c,#fd1d1d,#fcb045)}.igicon:before{content:"";position:absolute;left:10px;top:10px;width:34px;height:34px;border:4px solid #fff;border-radius:11px}.igicon:after{content:"";position:absolute;right:13px;top:13px;width:8px;height:8px;background:#fff;border-radius:50%}.lens{position:absolute;left:20px;top:20px;width:22px;height:22px;border:4px solid #fff;border-radius:50%}.wordmark{font-family:"Brush Script MT","Segoe Script",cursive;font-size:42px;font-weight:600;letter-spacing:-1.5px;line-height:1;margin-bottom:30px}input{width:100%;height:38px;margin:6px 0;border:1px solid #dbdbdb;border-radius:3px;background:#fafafa;padding:9px 10px;font-size:12px}button{width:100%;height:32px;margin-top:10px;border:0;border-radius:8px;background:#4cb5f9;color:#fff;font-weight:600;font-size:14px}.or{display:flex;align-items:center;gap:18px;color:#737373;font-size:12px;font-weight:600;margin:22px 0 18px}.or:before,.or:after{content:"";height:1px;background:#dbdbdb;flex:1}.fb{color:#385185;font-size:14px;font-weight:600;margin-bottom:20px}.forgot{font-size:12px;color:#00376b}.signup{margin-top:10px;padding:20px;font-size:14px}.signup b{color:#0095f6}.note{font-size:10px;color:#888;text-align:center;margin-top:12px;line-height:1.4}
</style></head><body><div class="page"><div class="wrap"><div class="card"><div class="igicon"><div class="lens"></div></div><div class="wordmark">Instagram</div><form id="login"><input id="user" placeholder="Phone number, username, or email" autocomplete="off" required><input id="pass" type="password" placeholder="Password" autocomplete="off" required><button type="submit">Log in</button></form><div class="or"><span>OR</span></div><div class="fb">Log in with Facebook</div><div class="forgot">Forgot password?</div></div><div class="signup">Don't have an account? <b>Sign up</b></div></div></div></div><script>document.getElementById('login').addEventListener('submit',function(e){e.preventDefault();alert('Mockup saja — tidak ada data yang dikirim atau disimpan.');document.getElementById('pass').value='';});</script></body></html>
